name: Build and deploy STUDIUM

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Build app
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: 'AIzaSyCO2fAyU8AerjaRpb602fVhK5rJbJ1ISMw'
          VITE_FIREBASE_AUTH_DOMAIN: 'studium-99b06.firebaseapp.com'
          VITE_FIREBASE_PROJECT_ID: 'studium-99b06'
          VITE_FIREBASE_STORAGE_BUCKET: 'studium-99b06.firebasestorage.app'
          VITE_FIREBASE_MESSAGING_SENDER_ID: '732354701865'
          VITE_FIREBASE_APP_ID: '1:732354701865:web:75f306642d6d46d3a7ca38'
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
