<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#111111" />
    <meta name="description" content="STUDIUM — учебное пространство вашей группы." />
    <link rel="icon" href="./studium-mark.svg" type="image/svg+xml" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <title>STUDIUM — учебное пространство</title>
  </head>
  <body>
    <div id="app"><div class="boot">STUDIUM</div></div>
    <script type="module" src="/src/main.js"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch((error) => console.warn('Service worker registration failed', error)));
      }
    </script>
  </body>
</html>
